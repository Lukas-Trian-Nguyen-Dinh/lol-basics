 points:["<kbd>Z</kbd>: Kamera an deinen Champion sperren oder lösen","<kbd>Leertaste</kbd> halten: Kamera springt zurück zu deinem Champion","Mauszeiger an den Bildschirmrand: Kamera verschieben (wenn sie gelöst ist)"],

 subs:[

  {title:"Ultimate (R)",video:"",text:"Die stärkste Fähigkeit deines Champions. Du schaltest sie ab Level 6 frei und verbesserst sie auf Level 11 und 16. Ihr Cooldown ist lang, dafür kann sie einen Kampf entscheiden."},
